<svg xmlns="http://www.w3.org/2000/svg" width="560" height="480" viewBox="0 0 560 480" role="img" aria-labelledby="title description">
<title id="title">Muhammad Idris Marzuki - Informatics Engineering Student • Developer</title>
<desc id="description">An animated profile console with an ASCII portrait.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FBFF"/><stop offset="1" stop-color="#F5F3FF"/></linearGradient>
  <linearGradient id="ascii-signal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0891B2"><animate attributeName="stop-color" values="#0891B2;#6D28D9;#2563EB;#0891B2" dur="9s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#6D28D9"><animate attributeName="stop-color" values="#6D28D9;#2563EB;#0891B2;#6D28D9" dur="9s" repeatCount="indefinite"/></stop></linearGradient>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6D28D9"/><stop offset="0.48" stop-color="#0891B2"/><stop offset="1" stop-color="#047857"/></linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0891B2" stop-opacity="0"/><stop offset="0.5" stop-color="#0891B2" stop-opacity="0.46"/><stop offset="1" stop-color="#6D28D9" stop-opacity="0"/></linearGradient>
  <radialGradient id="portrait-halo"><stop offset="0" stop-color="#0891B2" stop-opacity="0.12"/><stop offset="0.48" stop-color="#2563EB" stop-opacity="0.055"/><stop offset="1" stop-color="#6D28D9" stop-opacity="0"/></radialGradient>
  <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#0891B2" opacity="0.052"/></pattern>
  <pattern id="portrait-grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M 44 0 H 0 V 44" fill="none" stroke="#2563EB" stroke-width="0.65" opacity="0.085"/><circle cx="0" cy="0" r="1.2" fill="#0891B2" opacity="0.13"/></pattern>
  <clipPath id="portrait-clip"><rect x="30" y="122" width="500" height="312" rx="12"/></clipPath>
  <mask id="portrait-reveal"><rect x="30" y="122" width="500" height="0" rx="12" fill="white"><animate attributeName="height" from="0" to="312" dur="2.1s" begin="0.12s" fill="freeze"/></rect></mask>
  <style>
    .mono { font-family: 'Courier New', Consolas, monospace; }
    .ascii { font-family: 'Courier New', Consolas, monospace; font-size: 6.6px; letter-spacing: -0.15px; fill: url(#ascii-signal); }
    .panel-title { font-family: 'Courier New', Consolas, monospace; font-size: 12px; letter-spacing: 2px; fill: #2563EB; opacity: 0.78; }
    .terminal-label { font-family: 'Courier New', Consolas, monospace; font-size: 11px; letter-spacing: 0.5px; fill: #64748B; }
    .live-label { font-family: 'Courier New', Consolas, monospace; font-size: 10px; letter-spacing: 1px; fill: #DC2626; }
    text, tspan { white-space: pre; }
  </style>
</defs>
<rect width="560" height="480" rx="22" fill="url(#background)"/>
<rect width="560" height="480" rx="22" fill="url(#scanlines)"/>
<rect x="20" y="20" width="520" height="42" rx="14" fill="#FFFFFF" fill-opacity="0.84"/>
<circle cx="41" cy="41" r="5" fill="#EF4444"/><circle cx="59" cy="41" r="5" fill="#F59E0B"/><circle cx="77" cy="41" r="5" fill="#047857"/>
<text x="280" y="46" text-anchor="middle" class="terminal-label">marzuki23@profile ~ % ./profile --live</text>

<rect x="20" y="94" width="520" height="350" rx="14" fill="#FFFFFF" fill-opacity="0.38" stroke="url(#border)" stroke-opacity="0.42"/>
