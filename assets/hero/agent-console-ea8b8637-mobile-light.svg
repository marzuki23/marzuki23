  <ellipse cx="280.0" cy="256.2" rx="164.0" ry="73.5" fill="none" stroke="#6D28D9" stroke-width="1" stroke-dasharray="28 24" opacity="0.1"><animateTransform attributeName="transform" type="rotate" from="360 280.0 256.2" to="0 280.0 256.2" dur="34s" repeatCount="indefinite"/></ellipse>
  <path d="M 64 160 H 126 M 64 160 V 214 M 496 404 H 434 M 496 404 V 350" fill="none" stroke="#0891B2" stroke-width="1.2" opacity="0.2"/>
  <path d="M 64 298.2 C 96 264.2, 157.0 314.2, 202.1 283.2" fill="none" stroke="#2563EB" opacity="0.12"/>
  <path d="M 496 204.2 C 458 238.2, 407.1 186.2, 362.0 226.2" fill="none" stroke="#047857" opacity="0.11"/>
  <g fill="#0891B2"><circle cx="64" cy="160" r="2.2" opacity="0.42"><animate attributeName="opacity" values="0.2;0.58;0.2" dur="5.6s" repeatCount="indefinite"/></circle><circle cx="496" cy="404" r="2.2" opacity="0.42"><animate attributeName="opacity" values="0.58;0.2;0.58" dur="6.4s" repeatCount="indefinite"/></circle><circle cx="82" cy="304.2" r="1.7" opacity="0.32"/><circle cx="480" cy="198.2" r="1.7" opacity="0.28"/></g>
</g>
