  <path d="M 768 240.2 C 730 274.2, 640.8 222.2, 564.4 262.2" fill="none" stroke="#10B981" opacity="0.11"/>
  <g fill="#22D3EE"><circle cx="52" cy="128" r="2.2" opacity="0.42"><animate attributeName="opacity" values="0.2;0.58;0.2" dur="5.6s" repeatCount="indefinite"/></circle><circle cx="768" cy="478" r="2.2" opacity="0.42"><animate attributeName="opacity" values="0.58;0.2;0.58" dur="6.4s" repeatCount="indefinite"/></circle><circle cx="64" cy="340.2" r="1.7" opacity="0.32"/><circle cx="758" cy="234.2" r="1.7" opacity="0.28"/></g>
