<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" role="img" aria-labelledby="title description">
<title id="title">Muhammad Idris Marzuki - Informatics Engineering Student • Developer</title>
<desc id="description">An animated profile console with an ASCII portrait.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset="1" stop-color="#11152F"/></linearGradient>
  <linearGradient id="ascii-signal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"><animate attributeName="stop-color" values="#22D3EE;#7C3AED;#38BDF8;#22D3EE" dur="9s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#7C3AED"><animate attributeName="stop-color" values="#7C3AED;#38BDF8;#22D3EE;#7C3AED" dur="9s" repeatCount="indefinite"/></stop></linearGradient>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C3AED"/><stop offset="0.48" stop-color="#22D3EE"/><stop offset="1" stop-color="#10B981"/></linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.46"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></linearGradient>
  <radialGradient id="portrait-halo"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.12"/><stop offset="0.48" stop-color="#38BDF8" stop-opacity="0.055"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
  <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#22D3EE" opacity="0.052"/></pattern>
  <pattern id="portrait-grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M 44 0 H 0 V 44" fill="none" stroke="#38BDF8" stroke-width="0.65" opacity="0.085"/><circle cx="0" cy="0" r="1.2" fill="#22D3EE" opacity="0.13"/></pattern>
  <clipPath id="portrait-clip"><rect x="24" y="82" width="772" height="438" rx="12"/></clipPath>
  <mask id="portrait-reveal"><rect x="24" y="82" width="772" height="0" rx="12" fill="white"><animate attributeName="height" from="0" to="438" dur="2.1s" begin="0.12s" fill="freeze"/></rect></mask>
  <style>
    .mono { font-family: 'Courier New', Consolas, monospace; }
    .ascii { font-family: 'Courier New', Consolas, monospace; font-size: 6.5px; letter-spacing: -0.15px; fill: url(#ascii-signal); }
    .panel-title { font-family: 'Courier New', Consolas, monospace; font-size: 11px; letter-spacing: 2px; fill: #38BDF8; opacity: 0.78; }
    .terminal-label { font-family: 'Courier New', Consolas, monospace; font-size: 12px; letter-spacing: 0.5px; fill: #64748B; }
    .live-label { font-family: 'Courier New', Consolas, monospace; font-size: 10px; letter-spacing: 1px; fill: #F87171; }
    text, tspan { white-space: pre; }
  </style>
</defs>
<rect width="820" height="560" rx="18" fill="url(#background)"/>
<rect width="820" height="560" rx="18" fill="url(#scanlines)"/>
<rect x="3" y="3" width="814" height="34" rx="16" fill="#07111F" fill-opacity="0.84"/>
<circle cx="24" cy="20" r="5" fill="#EF4444"/><circle cx="42" cy="20" r="5" fill="#F59E0B"/><circle cx="60" cy="20" r="5" fill="#10B981"/>
<text x="410" y="25" text-anchor="middle" class="terminal-label">marzuki23@profile ~ % ./profile --live</text>
<circle cx="679" cy="20" r="4" fill="#F87171"><animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite"/></circle><text x="689" y="24" class="live-label">SCANNING</text>
<rect x="14" y="64" width="792" height="468" rx="14" fill="#07111F" fill-opacity="0.38" stroke="url(#border)" stroke-opacity="0.42"/>
<text x="30" y="62" class="panel-title">VISUAL.MAP / PORTRAIT.SIGNAL</text>
